# =====================================
# dg-tools V2 Configuration
# =====================================

# ---- Chunking ----
extractor.chunk.max-tokens=2000

# ---- ZIP Security ----
extractor.zip.max-per-file=104857600
extractor.zip.max-total-size=524288000
extractor.zip.max-compression-ratio=100
extractor.zip.max-entries=10000

# ---- Excel ----
extractor.excel.large-table-threshold=50
extractor.excel.column-threshold=10
extractor.excel.csv-slice-threshold=500
extractor.excel.csv-chunk-size=100

# ---- Pipeline ----
extractor.pipeline.max-file-size=209715200
extractor.pipeline.max-depth=10

# ---- Image ----
extractor.image.max-bytes=104857600
