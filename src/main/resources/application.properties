# =====================================
# dg-tools V2 Configuration
# =====================================

# ---- Chunking ----
dg.chunk.max-tokens=2000

# ---- ZIP Security ----
dg.zip.max-per-file=104857600
dg.zip.max-total-size=524288000
dg.zip.max-compression-ratio=100
dg.zip.max-entries=10000

# ---- Excel ----
dg.excel.large-table-threshold-rows=50
dg.excel.large-table-threshold-cols=10
dg.excel.csv-slice-threshold=500
dg.excel.csv-chunk-size=100

# ---- Pipeline ----
dg.pipeline.max-file-size=209715200
dg.pipeline.max-depth=10

# ---- Image ----
dg.image.max-bytes=104857600
